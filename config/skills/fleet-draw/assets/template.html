<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; border-bottom: 1px solid #1e293b; background: #111827; }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  #breadcrumb { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  #breadcrumb a { color: #60a5fa; text-decoration: none; cursor: pointer; }
  #summary { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; }
  #tabs button {
    background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 6px;
    padding: 5px 12px; margin-right: 6px; font-size: 12px; cursor: pointer;
  }
  #tabs button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  #viewport { flex: 1; overflow: auto; padding: 16px; }
  #detail {
    width: 360px; flex-shrink: 0; border-left: 1px solid #1e293b; background: #111827;
    padding: 14px; overflow-y: auto; font-size: 13px;
  }
  .empty { color: #64748b; font-style: italic; }
  .gnode text { font-family: inherit; }

  /* gantt */
  .gantt { min-width: 640px; }
  .gantt-axis { position: relative; height: 20px; margin-left: 180px; border-bottom: 1px solid #334155; margin-bottom: 4px; }
  .gantt-axis span { position: absolute; top: 0; font-size: 10px; color: #64748b; transform: translateX(-50%); }
  .gantt-row { display: flex; align-items: center; height: 34px; border-bottom: 1px solid #1e293b; }
  .gantt-label {
    width: 180px; flex-shrink: 0; font-size: 12px; padding-right: 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gantt-label:hover { color: #60a5fa; }
  .gantt-track { position: relative; flex: 1; height: 20px; background: #0b1220; border-radius: 3px; }
  .span-seg {
    position: absolute; top: 0; height: 100%; min-width: 3px; border-radius: 3px; cursor: pointer;
    opacity: 0.9;
  }
  .span-seg:hover { outline: 1px solid #fff; opacity: 1; }
  .span-live {
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .span-error { outline: 2px solid #7f1d1d; box-shadow: 0 0 6px #ef4444; }
  @keyframes pulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

  /* errors */
  .error-row {
    padding: 8px 10px; border: 1px solid #334155; border-radius: 6px; margin-bottom: 6px;
    cursor: pointer; font-size: 12px; background: #1e1215;
  }
  .error-row:hover { border-color: #ef4444; }

  /* detail panel */
  .field { margin-bottom: 10px; }
  .field .label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; margin-bottom: 2px; }
  .field .value { display: block; font-size: 13px; word-break: break-word; }
  .field pre { margin: 0; font-size: 11px; white-space: pre-wrap; word-break: break-word; color: #cbd5e1; }
  .error-box {
    background: #450a0a; color: #fecaca; border: 1px solid #ef4444; border-radius: 6px;
    padding: 10px; margin-bottom: 14px; font-family: monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .error-box::before { content: "⚠ ERROR"; display: block; font-weight: bold; margin-bottom: 6px; }
  .span-btn {
    display: inline-block; font-size: 11px; padding: 3px 8px; margin: 0 6px 6px 0;
    border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; cursor: pointer;
  }
  .span-btn-error { border-color: #ef4444; background: #450a0a; color: #fecaca; }
  #detail a { color: #60a5fa; }
</style>
</head>
<body>
<header>
  <h1 id="title">Fleet status</h1>
  <div id="breadcrumb"></div>
  <div id="summary"></div>
  <nav id="tabs">
    <button data-view="graph" class="active">Graph</button>
    <button data-view="gantt">Gantt</button>
    <button data-view="errors">Errors</button>
  </nav>
</header>
<main>
  <section id="viewport"></section>
  <aside id="detail"><div class="empty">Click a node or span for details.</div></aside>
</main>
<script id="fleet-data" type="application/json">__FLEET_DATA_JSON__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('fleet-data').textContent);
  const fleet = DATA.fleet;
  const dagStates = DATA.dagStates;
  const generatedAt = DATA.generatedAt;

  const state = { view: 'graph', level: 'fleet', dagId: null };

  const viewport = document.getElementById('viewport');
  const detail = document.getElementById('detail');
  const breadcrumbEl = document.getElementById('breadcrumb');
  const summaryEl = document.getElementById('summary');

  document.getElementById('title').textContent = 'Fleet status — ' + (fleet.meta?.runName || DATA.runName);

  document.querySelectorAll('#tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.view = btn.dataset.view;
      render();
    });
  });

  const STATUS_COLOR = {
    pending: '#9ca3af', running: '#3b82f6', review: '#eab308', fixing: '#eab308',
    passed: '#22c55e', failed: '#ef4444',
  };
  const ROLE_COLOR = {
    worker: '#0d9488', reviewer: '#7c3aed', judge: '#ea580c', orchestrator: '#475569', steering: '#db2777',
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

  function formatDuration(ms) {
    if (ms < 1000) return ms + 'ms';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60) + 's';
  }

  function computeSummary() {
    let total = 0, passed = 0, errors = 0, running = 0;
    fleet.dags.forEach(function (dag) {
      if (dag.status === 'running') running++;
      (dag.audit || []).forEach(function (a) { if (a.status === 'error') errors++; });
      const st = dagStates[dag.id];
      (st?.nodes || []).forEach(function (n) {
        total++;
        if (n.runtime.status === 'passed') passed++;
        (n.audit || []).forEach(function (a) { if (a.status === 'error') errors++; });
      });
    });
    return { total: total, passed: passed, errors: errors, running: running };
  }

  function renderSummary() {
    const s = computeSummary();
    summaryEl.textContent = s.passed + '/' + s.total + ' task passed \u00b7 ' + s.errors +
      ' error span(s) \u00b7 ' + s.running + ' DAG running';
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = '';
    const fleetLink = document.createElement('a');
    fleetLink.href = '#';
    fleetLink.textContent = 'Fleet';
    fleetLink.onclick = function (e) {
      e.preventDefault();
      state.level = 'fleet';
      state.dagId = null;
      render();
    };
    breadcrumbEl.appendChild(fleetLink);
    if (state.level === 'dag') {
      const dag = fleet.dags.find(function (d) { return d.id === state.dagId; });
      breadcrumbEl.appendChild(document.createTextNode(' \u203a '));
      const span = document.createElement('span');
      span.textContent = dag ? (dag.title || dag.id) : state.dagId;
      breadcrumbEl.appendChild(span);
    }
  }

  function render() {
    renderSummary();
    renderBreadcrumb();
    viewport.innerHTML = '';
    if (state.view === 'graph') renderGraph();
    else if (state.view === 'gantt') renderGantt();
    else renderErrors();
  }

  // ---------- graph view ----------

  function svgEl(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Topological layering: layer(node) = 1 + max(layer(dep)) over dependsOn, 0 if none.
  function layerNodes(nodes, idKey) {
    const byId = new Map(nodes.map(function (n) { return [n[idKey], n]; }));
    const layer = new Map();
    function computeLayer(id, seen) {
      if (layer.has(id)) return layer.get(id);
      if (seen.has(id)) return 0; // cycle guard — should not happen, validated upstream
      seen.add(id);
      const n = byId.get(id);
      const deps = (n.dependsOn || []).filter(function (d) { return byId.has(d); });
      const l = deps.length
        ? 1 + Math.max.apply(null, deps.map(function (d) { return computeLayer(d, seen); }))
        : 0;
      layer.set(id, l);
      return l;
    }
    nodes.forEach(function (n) { computeLayer(n[idKey], new Set()); });
    return layer;
  }

  function renderGraph() {
    if (state.level === 'fleet') {
      renderGraphLevel(
        fleet.dags, 'id',
        function (d) { return d.status; },
        function (d) { return { title: d.title || d.id, badge: d.judge && d.judge.verdict ? d.judge.verdict : null }; },
        onDagClick
      );
    } else {
      const st = dagStates[state.dagId];
      renderGraphLevel(
        st.nodes, 'id',
        function (n) { return n.runtime.status; },
        function (n) { return { title: n.ticket.title || n.id, badge: n.runtime.fixAttempt > 0 ? ('fix:' + n.runtime.fixAttempt) : null }; },
        onNodeClick
      );
    }
  }

  function renderGraphLevel(nodes, idKey, statusFn, labelFn, onClick) {
    if (!nodes.length) { viewport.innerHTML = '<p class="empty">No nodes.</p>'; return; }
    const layer = layerNodes(nodes, idKey);
    const byLayer = {};
    nodes.forEach(function (n) {
      const l = layer.get(n[idKey]) || 0;
      (byLayer[l] = byLayer[l] || []).push(n);
    });
    const layerCount = Math.max.apply(null, Object.keys(byLayer).map(Number)) + 1;
    const colW = 210, rowH = 80, nodeW = 170, nodeH = 54;
    const maxRows = Math.max.apply(null, Object.values(byLayer).map(function (a) { return a.length; }));
    const width = layerCount * colW + 40;
    const height = maxRows * rowH + 40;

    const svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height });
    const defs = svgEl('defs', {});
    const marker = svgEl('marker', {
      id: 'arrow', markerWidth: 10, markerHeight: 10, refX: 8, refY: 3, orient: 'auto', markerUnits: 'strokeWidth',
    });
    marker.appendChild(svgEl('path', { d: 'M0,0 L0,6 L9,3 z', fill: '#94a3b8' }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    const pos = {};
    Object.keys(byLayer).forEach(function (lStr) {
      const l = Number(lStr);
      byLayer[l].forEach(function (n, i) {
        pos[n[idKey]] = { x: 20 + l * colW, y: 20 + i * rowH, n: n };
      });
    });

    const idSet = new Set(nodes.map(function (n) { return n[idKey]; }));
    nodes.forEach(function (n) {
      (n.dependsOn || []).forEach(function (dep) {
        if (!idSet.has(dep)) return;
        const a = pos[dep], b = pos[n[idKey]];
        if (!a || !b) return;
        const x1 = a.x + nodeW, y1 = a.y + nodeH / 2, x2 = b.x, y2 = b.y + nodeH / 2;
        const mx = (x1 + x2) / 2;
        svg.appendChild(svgEl('path', {
          d: 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2,
          stroke: '#94a3b8', 'stroke-width': 1.5, fill: 'none', 'marker-end': 'url(#arrow)',
        }));
      });
    });

    nodes.forEach(function (n) {
      const p = pos[n[idKey]];
      const g = svgEl('g', { class: 'gnode', transform: 'translate(' + p.x + ',' + p.y + ')', style: 'cursor:pointer' });
      const status = statusFn(n);
      g.appendChild(svgEl('rect', {
        width: nodeW, height: nodeH, rx: 8,
        fill: STATUS_COLOR[status] || '#9ca3af', stroke: '#0f172a', 'stroke-width': 1.5,
      }));
      const info = labelFn(n);
      const t1 = svgEl('text', { x: 8, y: 20, fill: '#fff', 'font-size': 12 });
      t1.textContent = truncate(n[idKey] + ' \u00b7 ' + info.title, 24);
      g.appendChild(t1);
      const t2 = svgEl('text', { x: 8, y: 38, fill: '#f1f5f9', 'font-size': 10 });
      t2.textContent = status;
      g.appendChild(t2);
      if (info.badge) {
        const bt = svgEl('text', { x: nodeW - 8, y: 14, fill: '#fff', 'font-size': 10, 'text-anchor': 'end' });
        bt.textContent = info.badge;
        g.appendChild(bt);
      }
      g.addEventListener('click', function () { onClick(n); });
      svg.appendChild(g);
    });

    viewport.appendChild(svg);
  }

  function onDagClick(dag) {
    state.level = 'dag';
    state.dagId = dag.id;
    selectDag(dag);
    render();
  }

  function onNodeClick(node) {
    selectNode(node, state.dagId);
  }

  // ---------- gantt view ----------

  function renderGantt() {
    if (state.level === 'fleet') {
      renderGanttLevel(fleet.dags.map(function (d) {
        return { id: d.id, label: d.id + ' \u00b7 ' + (d.title || ''), audit: d.audit || [] };
      }), onDagClick, null);
    } else {
      const st = dagStates[state.dagId];
      renderGanttLevel(st.nodes.map(function (n) {
        return { id: n.id, label: n.id + ' \u00b7 ' + (n.ticket.title || ''), audit: n.audit || [] };
      }), onNodeClick, st.nodes);
    }
  }

  function renderGanttLevel(rows, onRowClick, rawNodes) {
    let minT = Infinity, maxT = -Infinity;
    const now = new Date(generatedAt).getTime();
    rows.forEach(function (r) {
      r.audit.forEach(function (a) {
        const s = new Date(a.startedAt).getTime();
        const e = a.endedAt ? new Date(a.endedAt).getTime() : now;
        if (s < minT) minT = s;
        if (e > maxT) maxT = e;
      });
    });
    if (!isFinite(minT)) { viewport.innerHTML = '<p class="empty">No audit spans.</p>'; return; }
    if (maxT === minT) maxT = minT + 1000;

    const container = document.createElement('div');
    container.className = 'gantt';

    const axis = document.createElement('div');
    axis.className = 'gantt-axis';
    const ticks = 5;
    for (let i = 0; i <= ticks; i++) {
      const t = minT + (maxT - minT) * i / ticks;
      const tick = document.createElement('span');
      tick.style.left = (i / ticks * 100) + '%';
      tick.textContent = new Date(t).toISOString().slice(11, 19);
      axis.appendChild(tick);
    }
    container.appendChild(axis);

    rows.forEach(function (r) {
      const rowEl = document.createElement('div');
      rowEl.className = 'gantt-row';
      const label = document.createElement('div');
      label.className = 'gantt-label';
      label.textContent = r.label;
      label.title = r.label;
      label.onclick = function () {
        const src = rawNodes ? rawNodes.find(function (x) { return x.id === r.id; })
                              : fleet.dags.find(function (d) { return d.id === r.id; });
        if (src) onRowClick(src);
      };
      rowEl.appendChild(label);

      const track = document.createElement('div');
      track.className = 'gantt-track';
      r.audit.forEach(function (a) {
        const s = new Date(a.startedAt).getTime();
        const e = a.endedAt ? new Date(a.endedAt).getTime() : now;
        const left = (s - minT) / (maxT - minT) * 100;
        const width = Math.max((e - s) / (maxT - minT) * 100, 0.6);
        const seg = document.createElement('div');
        seg.className = 'span-seg' + (a.status === 'error' ? ' span-error' : '') + (!a.endedAt ? ' span-live' : '');
        seg.style.left = left + '%';
        seg.style.width = width + '%';
        seg.style.background = a.status === 'error' ? '#ef4444' : (ROLE_COLOR[a.role] || '#64748b');
        seg.title = a.role + ' \u2014 ' + a.summary;
        seg.onclick = function (ev) { ev.stopPropagation(); selectSpan(a); };
        track.appendChild(seg);
      });
      rowEl.appendChild(track);
      container.appendChild(rowEl);
    });

    viewport.appendChild(container);
  }

  // ---------- errors view ----------

  function renderErrors() {
    const list = document.createElement('div');
    list.className = 'error-list';
    let any = false;
    fleet.dags.forEach(function (dag) {
      (dag.audit || []).forEach(function (a) {
        if (a.status !== 'error') return;
        any = true;
        list.appendChild(errorRow(dag.id, null, a));
      });
      const st = dagStates[dag.id];
      (st?.nodes || []).forEach(function (n) {
        (n.audit || []).forEach(function (a) {
          if (a.status !== 'error') return;
          any = true;
          list.appendChild(errorRow(dag.id, n.id, a));
        });
      });
    });
    if (!any) list.innerHTML = '<p class="empty">No errors recorded.</p>';
    viewport.appendChild(list);
  }

  function errorRow(dagId, nodeId, span) {
    const row = document.createElement('div');
    row.className = 'error-row';
    row.innerHTML = '<strong>' + escapeHtml(dagId + (nodeId ? ' / ' + nodeId : '')) + '</strong> \u2014 ' +
      escapeHtml(span.role) + ' \u2014 ' + escapeHtml(span.summary || '');
    row.onclick = function () {
      state.level = nodeId ? 'dag' : 'fleet';
      state.dagId = nodeId ? dagId : null;
      selectSpan(span);
    };
    return row;
  }

  // ---------- detail panel ----------

  function fieldBlock(label, value) {
    const div = document.createElement('div');
    div.className = 'field';
    const l = document.createElement('span'); l.className = 'label'; l.textContent = label;
    const v = document.createElement('span'); v.className = 'value'; v.textContent = (value === null || value === undefined || value === '') ? '\u2014' : String(value);
    div.appendChild(l); div.appendChild(v);
    return div;
  }

  function attrBlock(label, attrs) {
    const div = document.createElement('div');
    div.className = 'field';
    const l = document.createElement('span'); l.className = 'label'; l.textContent = label;
    div.appendChild(l);
    const entries = attrs ? Object.entries(attrs) : [];
    if (!entries.length) {
      const v = document.createElement('span'); v.className = 'value'; v.textContent = '\u2014';
      div.appendChild(v);
      return div;
    }
    const pre = document.createElement('pre');
    pre.textContent = entries.map(function (e) { return e[0] + ': ' + e[1]; }).join('\n');
    div.appendChild(pre);
    return div;
  }

  function spanListBlock(label, spans) {
    const div = document.createElement('div');
    div.className = 'field';
    const l = document.createElement('span'); l.className = 'label'; l.textContent = label + ' (' + spans.length + ')';
    div.appendChild(l);
    spans.forEach(function (s) {
      const b = document.createElement('button');
      b.className = 'span-btn' + (s.status === 'error' ? ' span-btn-error' : '');
      b.textContent = s.role + ' \u00b7 ' + s.status;
      b.onclick = function () { selectSpan(s); };
      div.appendChild(b);
    });
    return div;
  }

  function commitBlock(sha) {
    const div = document.createElement('div');
    div.className = 'field';
    const l = document.createElement('span'); l.className = 'label'; l.textContent = 'Commit';
    div.appendChild(l);
    if (!sha) {
      const v = document.createElement('span'); v.className = 'value'; v.textContent = '\u2014';
      div.appendChild(v);
      return div;
    }
    const tmpl = fleet.git && fleet.git.webTemplate;
    if (tmpl) {
      const a = document.createElement('a');
      a.href = tmpl.replace('{sha}', sha);
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = sha.slice(0, 10);
      div.appendChild(a);
    } else {
      const v = document.createElement('span'); v.className = 'value'; v.textContent = sha;
      div.appendChild(v);
    }
    return div;
  }

  function selectDag(dag) {
    detail.innerHTML = '';
    detail.appendChild(fieldBlock('DAG', dag.id));
    detail.appendChild(fieldBlock('Ref', dag.ref));
    detail.appendChild(fieldBlock('Title', dag.title));
    detail.appendChild(fieldBlock('Status', dag.status));
    detail.appendChild(fieldBlock('Judge verdict', (dag.judge && dag.judge.verdict ? dag.judge.verdict : '\u2014') +
      ' (attempt ' + (dag.judge ? dag.judge.attempt : 0) + ')'));
    detail.appendChild(attrBlock('Attributes', dag.attributes));
    detail.appendChild(spanListBlock('Audit spans', dag.audit || []));
  }

  function selectNode(node, dagId) {
    detail.innerHTML = '';
    detail.appendChild(fieldBlock('Task', node.id));
    detail.appendChild(fieldBlock('Ticket', node.ticket.ref + ' \u2014 ' + node.ticket.title));
    detail.appendChild(fieldBlock('dependsOn', (node.dependsOn || []).join(', ')));
    detail.appendChild(fieldBlock('Routing', node.routing.worker + ' / ' + node.routing.reviewer +
      ' \u00b7 tolerance ' + node.routing.failureTolerance));
    detail.appendChild(fieldBlock('checkCommand', node.routing.checkCommand));
    detail.appendChild(fieldBlock('Runtime', node.runtime.status + ' \u00b7 fixAttempt ' + node.runtime.fixAttempt +
      ' \u00b7 handoverAttempt ' + node.runtime.handoverAttempt));
    detail.appendChild(commitBlock(node.runtime.commitSha));
    detail.appendChild(attrBlock('Attributes', node.attributes));
    detail.appendChild(spanListBlock('Audit spans', node.audit || []));
  }

  function selectSpan(span) {
    detail.innerHTML = '';
    if (span.status === 'error') {
      const errBox = document.createElement('div');
      errBox.className = 'error-box';
      errBox.textContent = span.error;
      detail.appendChild(errBox);
    }
    detail.appendChild(fieldBlock('Role', span.role));
    detail.appendChild(fieldBlock('Agent type', span.agentType));
    detail.appendChild(fieldBlock('Model', span.model));
    detail.appendChild(fieldBlock('Agent id', span.agentId));
    const start = new Date(span.startedAt).getTime();
    const end = span.endedAt ? new Date(span.endedAt).getTime() : new Date(generatedAt).getTime();
    detail.appendChild(fieldBlock('Duration', formatDuration(end - start) + (span.endedAt ? '' : ' (running)')));
    detail.appendChild(fieldBlock('Summary', span.summary));
    if (span.reportRef) detail.appendChild(fieldBlock('Report ref', span.reportRef));
    const sha = span.attributes && span.attributes.commitSha;
    if (sha) detail.appendChild(commitBlock(sha));
    detail.appendChild(attrBlock('Attributes', span.attributes));
  }

  render();
})();
</script>
</body>
</html>
