name: Daily update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - name: Update inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/daily-update.sh inputs

  plugins:
    if: always()
    needs: inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - name: Update plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/daily-update.sh plugins
